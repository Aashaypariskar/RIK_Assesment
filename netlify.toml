[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Route /api/details to Netlify serverless function
[[redirects]]
  from = "/api/details"
  to = "/.netlify/functions/details"
  status = 200

# Route all other SPA paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
